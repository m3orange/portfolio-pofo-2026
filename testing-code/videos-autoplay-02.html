<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>

    <body>



        <div style="padding:71.07% 0 0 0;position:relative;" class="wrapper">
            <iframe
                src="https://player.vimeo.com/video/1211997195?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479&amp;autoplay=1&amp;muted=1&amp;loop=1"
                frameborder="0"
                allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
                referrerpolicy="strict-origin-when-cross-origin"
                style="position:absolute;top:0;left:0;width:100%;height:100%;" title="map-tools-demo-light"></iframe>
        </div>

        <script src="https://player.vimeo.com/api/player.js"></script>



        <style>
            .wrapper {
     
                top: 2%;
                left: 2%;
                border: 1px solid blue;
  
   
            }

            .wrapper video {
                width: auto;
                height: auto;
                position: absolute;

            }





            .color-01 {
                border: 2px solid yellow;
            }

            .color-02 {
                border: 2px solid orange;
            }

            .color-03 {
                border: 2px solid red;
            }
        </style>

        <script>
            var videoWidth = 1280;
            var video = $(".video-container video").attr("srcdesk");
            if ($(window).width() < 721) {
                videoWidth = 720;
                video = $(".video-container video").attr("srcmob"));
            }
            $(".video-container video").attr("width", videoWidth).append('<source src="' + video + '" type="video/mp4" >'),
        </script>
    </body>

</html>
