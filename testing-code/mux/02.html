<!DOCTYPE html>
<html>
<head>
  <title>Background Video</title>
  <style>
    html, 
    body {
      height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
    }
    
    mux-background-video,
    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
  <script type="module" src="http://cdn.jsdelivr.net/npm/@mux/mux-background-video/html/+esm"></script>
</head>
<body>
  <mux-background-video src="https://stream.mux.com/TXhUZGZhLwPCJs02bah1ZXdkxr4KUr73SYLwUpZ3Lzvg.m3u8">
    <img src="https://image.mux.com/TXhUZGZhLwPCJs02bah1ZXdkxr4KUr73SYLwUpZ3Lzvg/thumbnail.png?width=214&height=121&time=11" alt="Mux Background Video" />
  </mux-background-video>

      <div id="hero">
      <mux-player
        stream-type="on-demand"
        playback-id="TXhUZGZhLwPCJs02bah1ZXdkxr4KUr73SYLwUpZ3Lzvg"
        loop
        muted
        autoplay
      ></mux-player>
      <h1>Be the hero.</h1>
      <p>Build video into your application with ease.</p>
    </div>



<style>
    body {
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
    "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif,
    "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
  margin: 0;
  color: #182929;
}

#hero {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 400px;
  width: 100%;
}

mux-player {
  --controls: none;
  --media-object-fit: cover;

  position: absolute;
  inset: 0;
  z-index: 0;
}

mux-player::part(gesture-layer) {
  display: none;
}

#hero h1,
#hero p {
  z-index: 1;
  color: white;
}

#hero h1 {
  font-style: italic;
}

h1 {
  margin: 0;
  font-size: 3rem;
}

h2 {
  font-size: 2rem;
}

p {
  font-size: 1.3rem;
  color: #222;
}

main,
footer {
  margin: 0 20px;
}

</style>



  <script>
    const video = document.querySelector('#my-video');
    video.play().then(function () {
    // autoplay was successful!
    }).catch(function (error) {
    // do something if you want to handle or track this error
    });
  </script>
</body>
</html>
