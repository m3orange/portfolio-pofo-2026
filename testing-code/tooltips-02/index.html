<body>


 <section>
  <!-- This is https://stackoverflow.com/questions/65854934/is-a-css-only-inline-tooltip-with-html-content-inside-eg-images-possible -->
  <div class="container" style="min-height: 400px;">
  <div class="row">
   <div class="col col-8">
    <h3>Better Option</h3>
       <div class="inline">But I am hoverable.&nbsp; 
        <div class="content">I am tooltip content and I've got an image in me... 
          <img src="https://picsum.photos/200"/>
          <div>...and another div</div>
        </div>
      </div>
   </div>
  </div>

    <style>
   .inline {
     display:inline-block;
     position: relative;
   }
   .inline .content {
     display: none;
     position: absolute;
     top: 1em;
     left: 0;
     z-index: 99999;
     border-style: solid;
     background-color: white;
   }
   .inline:hover .content {
     display: block;
   }

   </style>

 </div>
</section>




<section>
 <div class="container" style="min-height: 400px;">

      <div class="tooltip-container">
       Hover over me
       <!-- Your rich HTML tooltip content goes here -->
       <div class="tooltip-box">
         <h4>Tooltip Title</h4>
         <p>This is styled text with a <a href="#">link</a>.</p>
         <img src="https://placeholder.com" alt="Icon">
       </div>
      </div>

    <style>

    body{
    padding: 200px;
    }

    /* The container wrapping both elements */
    .tooltip-container {
    position: relative;
    display: inline-block;
    cursor: pointer;
    }

    /* Hidden by default, absolute positioning layout */
    .tooltip-box {
    display: none;
    position: absolute;
    bottom: 125%; /* Places it above the text */
    left: 50%;
    transform: translateX(-50%);
    background-color: #333;
    color: #fff;
    padding: 10px;
    border-radius: 5px;
    width: 200px;
    z-index: 100;
    box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
    }

    /* Inline HTML content formatting */
    .tooltip-box a { color: #00ffff; }
    .tooltip-box h4 { margin: 0 0 5px 0; color: #ffcc00; }

    /* Show the tooltip on hover */
    .tooltip-container:hover .tooltip-box {
    display: block;
    }
    </style>
</div>
</section>
