
<!DOCTYPE html>
<html lang="en">
  <head>

  </head>
  <body>


<div class="frame">
	<div class="grid">
		
		<!-- 01 -->
		<div class="stage">
			<div class="label">
				<span class="index">01</span>
				<h1>
					Command<br />
					Path
				</h1>
			</div>

			<div class="g1-ring-stage">
				<div class="g1-ring-group">
					<div class="g1-ring g1-ring-1"></div>
					<div class="g1-ring g1-ring-2"></div>
					<div class="g1-ring g1-ring-3"></div>
				</div>
			</div>
		</div>

		<!-- 02 -->
		<div class="stage">
			<div class="label">
				<span class="index">02</span>
				<h1>
					Data<br />
					Signals
				</h1>
			</div>

			<div class="g2-ring-stage">
				<div class="g2-ring g2-ring-outer"></div>
				<div class="g2-ring-inner-wrap">
					<div class="g2-ring g2-ring-1"></div>
					<div class="g2-ring g2-ring-2"></div>
				</div>
			</div>
		</div>

		<!-- 03 -->
		<div class="stage">
			<div class="label">
				<span class="index">03</span>
				<h1>
					Build<br />
					Systems
				</h1>
			</div>

			<div class="g3-shape-stage">
				<div class="g3-shape g3-shape-1"></div>
				<div class="g3-shape g3-shape-2"></div>
				<div class="g3-shape g3-shape-3"></div>
			</div>
		</div>

		<!-- 04 -->
		<div class="stage">
			<div class="label">
				<span class="index">04</span>
				<h1>
					Discovery<br />
					Map
				</h1>
			</div>

			<div class="g4-globe">
				<div class="g4-ring g4-ring-outer"></div>
				<div class="g4-ring-wrap">
					<div class="g4-ring g4-ring-left"></div>
					<div class="g4-ring g4-ring-center is-default"></div>
					<div class="g4-ring g4-ring-right"></div>
				</div>
			</div>
		</div>
		
	</div>
</div>


<style>
  :root {
	--bg: #0f0f10;
	--white: #e9e9ea;
	--grid: rgba(255, 255, 255, 0.35);
	--green: #7cffc4;
}

* {
	box-sizing: border-box;
}

body {
	margin: 0;
	background: var(--bg);
	color: var(--white);
	font-family: system-ui, -apple-system, sans-serif;
	min-height: 100vh;
	display: grid;
	place-items: center;
	padding: 24px;
}

.frame {
	width: min(980px, 100%);
	border: 1px solid rgba(255, 255, 255, 0.18);
}

.grid {
	display: grid;
	grid-template-columns: repeat(2, minmax(0, 1fr));
	width: 100%;
}

.stage {
	padding: 44px;
	position: relative;
	min-height: 420px;
	border-right: 1px solid rgba(255, 255, 255, 0.18);
	border-bottom: 1px solid rgba(255, 255, 255, 0.18);
}

.stage:nth-child(2n) {
	border-right: 0;
}

.stage:nth-last-child(-n + 2) {
	border-bottom: 0;
}

.placeholder {
	opacity: 0.1;
}

.label {
	display: grid;
	grid-template-columns: 20px 1fr;
	column-gap: 16px;
	align-items: start;
	margin-bottom: 28px;
}

.index {
	opacity: 0.4;
	font-size: 14px;
	margin-top: 6px;
	width: 20px;
}

.label h1 {
	font-weight: 500;
	line-height: 1.05;
	margin: 0;
	font-size: 40px;
}

@media (max-width: 820px) {
	body {
		padding: 0;
		place-items: stretch;
	}

	.frame {
		width: 100%;
		border-left: 0;
		border-right: 0;
	}

	.grid {
		grid-template-columns: 1fr;
	}

	.stage {
		min-height: 360px;
		border-right: 0;
		border-bottom: 0;
		padding: 32px 24px;
	}

	.stage:not(:last-child) {
		border-bottom: 1px solid rgba(255, 255, 255, 0.18);
	}

	.label h1 {
		font-size: 32px;
	}
}

/* 01 */
.g1-ring-stage {
	position: relative;
	width: 300px;
	height: 300px;
	margin-left: 36px;
	margin-top: 12px;
}

.g1-ring-group {
	position: absolute;
	inset: 0;
}

.g1-ring {
	position: absolute;
	width: 260px;
	height: 260px;
	border-radius: 50%;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%) rotateY(0deg);
	backface-visibility: visible;
}

.g1-ring-1 {
	border: 3px dashed var(--white);
	opacity: 0.7;
	z-index: 1;
}

.g1-ring-2 {
	border: 3px solid var(--white);
	opacity: 0.7;
	z-index: 2;
}

.g1-ring-3 {
	border: 3px solid var(--green);
	z-index: 3;
}

/* 02 */
.g2-ring-stage {
	position: relative;
	width: 320px;
	height: 240px;
	margin-left: -14px;
	margin-top: 12px;
}

.g2-ring {
	position: absolute;
	top: 50%;
	left: 50%;
	border-radius: 50%;
	transform: translate(-50%, -50%);
}

.g2-ring-outer {
	width: 220px;
	height: 220px;
	border: 2px solid rgba(255, 255, 255, 0.28);
}

.g2-ring-inner-wrap {
	position: absolute;
	width: 220px;
	height: 220px;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);
}

.g2-ring-1,
.g2-ring-2 {
	width: 130px;
	height: 130px;
	top: 50%;
	transform: translateY(-50%);
}

.g2-ring-1 {
	border: 2px dashed rgba(255, 255, 255, 0.9);
	left: 0;
}

.g2-ring-2 {
	border: 2px solid var(--green);
	left: auto;
	right: 0;
	transform: translateY(-50%);
}

/* 03 */
.g3-shape-stage {
	position: relative;
	width: 320px;
	height: 320px;
	margin-left: -6px;
	margin-top: 12px;
	overflow: hidden;
}

.g3-shape {
	position: absolute;
	border-radius: 0;
}

.g3-shape-1 {
	width: 180px;
	height: 180px;
	border: 1.5px solid rgba(255, 255, 255, 0.28);
	left: 42px;
	top: 98px;
}

.g3-shape-2 {
	width: 180px;
	height: 180px;
	border: 1.5px solid var(--green);
	border-radius: 50%;
	left: 42px;
	top: 98px;
}

.g3-shape-3 {
	width: 180px;
	height: 180px;
	border: 2px dashed rgba(255, 255, 255, 0.9);
	border-radius: 50%;
	left: 124px;
	top: 16px;
}

/* 04 */
.g4-globe {
	position: relative;
	width: 320px;
	height: 240px;
	display: flex;
	align-items: center;
	justify-content: center;
	margin-left: -14px;
	margin-top: 12px;
}

.g4-ring {
	position: absolute;
	top: 50%;
	left: 50%;
	border-radius: 50%;
	transform: translate(-50%, -50%);
}

.g4-ring-outer {
	width: 220px;
	height: 220px;
	border: 1.5px solid var(--white);
}

.g4-ring-wrap {
	position: absolute;
	inset: 0;
}

.g4-ring-left,
.g4-ring-center,
.g4-ring-right {
	width: 220px;
	height: 220px;
	border: 3px dashed var(--grid);
	opacity: 1;
	backface-visibility: visible;
}

.g4-ring-center.is-default {
	border-style: solid;
	border-color: var(--green);
	opacity: 1;
}

</style>

<script>

  /* 01 */
const g1Ring1 = document.querySelector(".g1-ring-1");
const g1Ring2 = document.querySelector(".g1-ring-2");
const g1Ring3 = document.querySelector(".g1-ring-3");

const g1Tl = gsap.timeline({
	repeat: -1,
	repeatDelay: 0.4
});

g1Tl
	.set([g1Ring1, g1Ring2, g1Ring3], {
		xPercent: -50,
		yPercent: -50,
		left: "50%",
		top: "50%",
		rotateY: 117
	})
	.set(g1Ring2, { x: -80 }, 0)
	.set(g1Ring1, { x: 80 }, 0)
	.set(g1Ring3, { x: 0 }, 0)
	.to(
		[g1Ring2, g1Ring1],
		{
			x: 0,
			duration: 0.6,
			ease: "expo.in"
		},
		0.2
	)
	.to(
		[g1Ring1, g1Ring2, g1Ring3],
		{
			rotateY: 0,
			duration: 0.5,
			ease: "expo.in"
		},
		0.5
	)
	.to(
		[g1Ring1, g1Ring2, g1Ring3],
		{
			rotateY: 117,
			duration: 0.5,
			ease: "expo"
		},
		1
	)
	.to(
		g1Ring2,
		{
			x: -80,
			duration: 1,
			ease: "elastic.out(1, 0.25)"
		},
		1.3
	)
	.to(
		g1Ring1,
		{
			x: 80,
			duration: 1,
			ease: "elastic.out(1, 0.25)"
		},
		1.3
	);

/* 02 */
const g2RingInnerWrap = document.querySelector(".g2-ring-inner-wrap");

const g2Tl = gsap.timeline({
	repeat: -1,
	repeatDelay: 0.4
});

g2Tl.to(
	g2RingInnerWrap,
	{
		rotate: 360,
		duration: 2.5,
		ease: "expo.inOut"
	},
	0.3
);

/* 03 */
const g3Shape2 = document.querySelector(".g3-shape-2");
const g3Shape3 = document.querySelector(".g3-shape-3");

const g3Tl = gsap.timeline({
	repeat: -1,
	repeatDelay: 0.4
});

gsap.set(g3Shape2, {
	scale: 1,
	borderColor: "#7cffc4"
});

gsap.set(g3Shape3, {
	rotation: 0
});

g3Tl
	.to(
		g3Shape3,
		{
			rotation: 45,
			duration: 0.9,
			ease: "power2.inOut"
		},
		0.3
	)
	.to(
		g3Shape2,
		{
			scale: 0.75,
			duration: 1,
			ease: "power2.inOut"
		},
		0.4
	)
	.to(
		g3Shape2,
		{
			borderColor: "#e9e9ea",
			duration: 1,
			ease: "power2.inOut"
		},
		0.4
	)
	.to(
		g3Shape3,
		{
			rotation: 0,
			duration: 1,
			ease: "elastic.out(1, 0.25)"
		},
		1.4
	)
	.to(
		g3Shape2,
		{
			scale: 1,
			duration: 1,
			ease: "elastic.out(1, 0.25)"
		},
		1.4
	)
	.to(
		g3Shape2,
		{
			borderColor: "#7cffc4",
			duration: 1,
			ease: "elastic.out(1, 0.25)"
		},
		1.4
	);

/* 04 */
const g4RingOuter = document.querySelector(".g4-ring-outer");
const g4RingLeft = document.querySelector(".g4-ring-left");
const g4RingRight = document.querySelector(".g4-ring-right");
const g4RingCenter = document.querySelector(".g4-ring-center");
const g4Rings = [g4RingLeft, g4RingCenter, g4RingRight];
const g4Size = 220;
const g4Angles = [60, 75, 40];
const g4Tilt = [0, 0, 0];

gsap.set([g4RingOuter, ...g4Rings], {
	xPercent: -50,
	yPercent: -50,
	left: "50%",
	top: "50%",
	width: g4Size,
	height: g4Size
});

gsap.set(g4RingOuter, {
	rotateY: 0,
	rotateX: 0
});

g4Rings.forEach((g4Ring, g4Index) => {
	g4Ring.classList.toggle("is-default", g4Index === 1);
	gsap.set(g4Ring, {
		rotateY: g4Angles[g4Index],
		rotateX: g4Tilt[g4Index]
	});
});

const g4Sequence = [g4RingCenter, g4RingLeft, g4RingRight];

const g4Tl = gsap.timeline({
	repeat: -1,
	repeatDelay: 0.4
});

g4Tl.to(g4Sequence, {
	rotateY: "+=360",
	duration: 3,
	ease: "expo.inOut",
	stagger: 0.3
});
</script>


    </body>
    </html>
