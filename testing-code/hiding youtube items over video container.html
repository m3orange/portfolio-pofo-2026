<!-- <iframe width="560" height="315" src="https://www.youtube.com/embed/G5EvbNWh1-k?si=5v_SBB1D_cUQ1FYS&amp;controls=0" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe> -->

<style>

@media screen and (min-width: 768px){
	.yt-wrapper {
		overflow: hidden;
		max-width: 100%;
	}

	.yt-frame-container {
    		position: relative;
    		padding-bottom: 56.25%; 
    		padding-top: 25px;
		width: 300%;
    		left: -100%;
	}

	.yt-frame-container iframe {
    		position: absolute; 
    		top: 0; 
    		left: 0; 
    		width: 100%; 
		height: 100%;
		pointer-events:none;
	}
}

@media screen and (max-width: 767px){
	.yt-frame-container iframe {
		aspect-ratio: 16/9;
        	pointer-events:none;
    }
</style>



  </body>
