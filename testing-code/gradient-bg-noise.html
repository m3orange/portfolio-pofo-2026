    <body>
        <div class="container">
        <div class="noisy-gradient-01"></div>
        <div class="noisy-gradient-02"></div>
        <div class="gradient-01"></div>
           <div class="gradient-02"></div>
                 <div class="gradient-03"></div>
        </div>



<style>

    /* from https://ninjarockstar.dev/noisy-gradients */
  

    .noisy-gradient-01, .noisy-gradient-02, .gradient-02{   width: 100vw; height: 200px;}

  .noisy-gradient-02{
        background: #3c0b63;
        background: linear-gradient(90deg, rgba(60, 11, 99, 1) 0%, rgba(134, 48, 209, 1) 25%, rgba(31, 123, 222, 1) 50%, rgba(25, 152, 207, 1) 75%, rgba(8, 214, 255, 1) 100%);
    }

    .noisy-gradient-01 {
	    --noise: url('data:image/svg+xml,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="turbulence" baseFrequency="1.01" numOctaves="7" stitchTiles="stitch" /><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.21"/></feComponentTransfer></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)" /></svg>');
        --gradient: linear-gradient(
            to bottom right,
            rgb(42, 123, 155) 0%,
            rgb(152, 87, 199) 50%,
            rgb(237, 83, 224) 100%
        );
	background: var(--noise), var(--gradient);
}

    .gradient-01{
        width: 100vw; height: 200px;
        background-color: #30cfd0;
background-image: linear-gradient(270deg, #30cfd0 0%, #330867 100%);
    }

.gradient-02{
    background-image: linear-gradient(to top, #6a85b6 0%, #bac8e0 100%);
}

.gradient-03{
    /* https://grabient.com/_gIogJNgJ2gIPgGugF7gEfgCcgCsg3AhXvgWS */

background: conic-gradient(from 90deg, #07444a 0.000deg, #1c5842 90.000deg, #477040 180.000deg, #808a46 270.000deg, #bca552 360.000deg);
width: 400px;
height: 400px;
position: absolute;
top: 50%;
left: 0;
z-index: 100;
}

.container{
        display: flex;
    flex-direction: column;
    height: 100vh;
}


    
</style>
