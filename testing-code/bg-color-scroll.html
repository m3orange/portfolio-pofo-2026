<style>
  body {

  /* Smooth color fade animation */
  transition: background-color 0.8s ease;

.bg-color-scroll {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #ffffff;
}

</style>

<script>
  // Grab all sections from the DOM
const panels = document.querySelectorAll('.bg-color-scroll');

// Set the initial background color from the first panel
document.body.style.backgroundColor = panels[0].getAttribute('data-bg');

window.addEventListener('scroll', () => {
  // Determine the midpoint of the screen
  const triggerPoint = window.innerHeight / 2;

  panels.forEach((panel) => {
    const panelTop = panel.getBoundingClientRect().top;

    // Check if the panel has scrolled past the midpoint trigger line
    if (panelTop <= triggerPoint && panelTop + panel.offsetHeight > triggerPoint) {
      const targetColor = panel.getAttribute('data-bg');
      document.body.style.backgroundColor = targetColor;
    }
  });
});

</script>
