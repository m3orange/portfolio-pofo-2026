        <style>

.control-area{
    display: flex;
    flex-direction: row;
    justify-content: space-between;

    border: 1px solid rgba(0,0,0,0.3);
}

#play-pause-btn {
    height: 60px;
}

#play-pause-btn img{
    max-height: 100%;
}

.view-larger-link{
    display: flex;
    flex-direction: column;
    justify-content: center;
}

#video-container-01{
    position: relative;
    width: 100%;
    height: fit-content;
    overflow: hidden;
    background-color: #000;
    aspect-ratio: 2 / 1.25;
}

#bg-video{
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
z-index: 0; /* Bring it above negative index so controls are clickable */
opacity: 1;
min-width: 100% !important;
object-fit: cover;
}

.content {
position: relative;
z-index: 1; /* Keeps text above the video */
color: white;

display: none;
}

button {padding: 10px 15px; cursor: pointer;}

        </style>


        <script>
            const video = document.getElementById('bg-video');
            const button = document.getElementById('play-pause-btn');

            button.addEventListener('click', controlVideo)

            function controlVideo() {
                if (video.paused) {
                video.play();
                button.innerHTML = '<img src="../images/video-controls/video-btn-pause.png"/>';
                } else {
                video.pause();
                button.innerHTML = '<img src="../images/video-controls/video-btn-play.png"/>';
                }
            }
        </script>
