kind = "web"
previewPath = "/"
title = "Image Gallery"
version = "1.0.0"
id = "artifacts/image-gallery"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21051

[services.development]
run = "pnpm --filter @workspace/image-gallery run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/image-gallery", "run", "build" ]
publicDir = "artifacts/image-gallery/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21051"
BASE_PATH = "/"
